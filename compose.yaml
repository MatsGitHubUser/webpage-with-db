# Local development. `docker compose up -d --build` runs the app on
# http://localhost:8501 with Azurite, Microsoft's local Azure Storage emulator,
# standing in for Table Storage; code changes reload automatically.
# `docker compose --profile test run --rm --build test` runs the tests against a
# separate, in-memory Azurite.

x-azurite: &azurite
  image: mcr.microsoft.com/azure-storage/azurite:3.35.0
  healthcheck: &azurite-health
    test: ["CMD", "node", "-e", "require('net').connect(10002, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
    interval: 2s
    retries: 20

# Azurite's built-in development account. The key is public and the same for
# every Azurite install, so it is not a secret.
x-storage: &storage
  AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;"

services:
  azurite:
    <<: *azurite
    command: azurite-table --tableHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10002:10002"
    volumes:
      - tabledata:/data

  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      <<: *storage
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"
    volumes:
      - ./app:/app:ro
    depends_on:
      azurite:
        condition: service_healthy

  testazurite:
    <<: *azurite
    profiles: [test]
    command: azurite-table --tableHost 0.0.0.0 --inMemoryPersistence --skipApiVersionCheck

  test:
    build:
      context: .
      target: test
    profiles: [test]
    environment:
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://testazurite:10002/devstoreaccount1;"
    depends_on:
      testazurite:
        condition: service_healthy

volumes:
  tabledata:
